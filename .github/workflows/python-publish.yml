# Publishes the package to PyPI using Trusted Publishing when a release is created
# For more information see: https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.1.1)"
        required: true

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
